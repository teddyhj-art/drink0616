<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>유달리 교직원 연수 음료 주문</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/+esm';

    // ===================================================
    // ★ 여기에 본인의 Supabase 설정값을 다시 입력하세요 ★
    // ===================================================
    const supabaseUrl = 'https://peoogqwjphvayngepfsn.supabase.co'; // 선생님 URL
    const supabaseKey = 'sb_publishable_a_HXX58Hxh3VHMhgdCOurw_ptSwJmSK'; // 선생님 KEY
    // ===================================================

    let supabase;
    window._beverages = []; // 이제 DB에서 불러옵니다.
    window._selectedBeverage = null;
    window._orders = [];
    window._isAdminAuthenticated = false;

    // ====== 초기화 함수 ======
    async function initApp() {
      initSupabase();
    }

    function initSupabase() {
      try {
        supabase = createClient(supabaseUrl, supabaseKey);
        
        // 연결 성공 시 UI 업데이트 (핑크색 불빛)
        document.getElementById('status-dot').className = 'w-3 h-3 rounded-full bg-white animate-pulse shadow-[0_0_10px_#ffffff]';
        document.getElementById('status-text').textContent = '정상 작동 중 (Supabase)';
        document.getElementById('submit-btn').classList.remove('bg-gray-400', 'cursor-not-allowed');
        document.getElementById('submit-btn').classList.add('bg-[#EF9099]', 'hover:bg-[#d67e86]');
        
        fetchBeverages(); // 메뉴 데이터 불러오기
        subscribeOrders(); // 주문 데이터 동기화
      } catch (e) {
        console.error('Supabase 초기화 오류:', e);
        showModal('데이터베이스 설정이 올바르지 않습니다.');
      }
    }

    // ====== DB에서 메뉴 데이터 불러오기 ======
    window.fetchBeverages = async function() {
      const { data, error } = await supabase
        .from('beverages')
        .select('*');
        
      if (error) {
        console.error('메뉴 불러오기 실패:', error);
      } else {
        window._beverages = data || [];
        renderMenu();
      }
    }

    // ====== DB에서 주문 데이터 불러오기 ======
    async function fetchOrders() {
      const { data, error } = await supabase
        .from('orders')
        .select('*')
        .order('timestamp', { ascending: true });
        
      if (error) {
        console.error('주문 불러오기 실패:', error);
      } else {
        window._orders = data || [];
        renderOrderSummary(data); 
      }
    }

    // 실시간 동기화
    function subscribeOrders() {
      fetchOrders(); 
      supabase.channel('public:orders').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, payload => {
        fetchOrders(); 
      }).subscribe();
      
      supabase.channel('public:beverages').on('postgres_changes', { event: '*', schema: 'public', table: 'beverages' }, payload => {
        fetchBeverages(); 
      }).subscribe();
    }

    // ====== 메뉴 렌더링 ======
    function renderMenu() {
      const container = document.getElementById('menu-container');
      if (!container) return;
      container.innerHTML = ''; 
      
      if (window._beverages.length === 0) {
        container.innerHTML = '<p class="text-gray-500 py-8 text-center">아직 등록된 메뉴가 없습니다. 관리자 모드에서 메뉴를 추가해주세요!</p>';
        return;
      }

      // 등록된 카테고리 중복 제거해서 추출
      const categories = [...new Set(window._beverages.map(b => b.category))];

      categories.forEach(cat => {
        const catBeverages = window._beverages.filter(b => b.category === cat);
        let cardsHtml = catBeverages.map(b => `
          <div class="beverage-card bg-white rounded-xl p-5 shadow-sm flex flex-col justify-between min-h-[120px]"
               id="card-${b.id}">
            <div>
              <!-- 사진 영역 -->
              ${b.image_url ? `<div class="w-full h-40 mb-4 rounded-lg overflow-hidden bg-gray-100 flex items-center justify-center"><img src="${b.image_url}" class="w-full h-full object-cover" alt="${b.name}"></div>` : ''}
              
              <div class="flex justify-between items-start mb-2">
                <h4 class="text-base font-bold text-gray-900 pr-8">${b.name}</h4>
                <div class="check-circle w-5 h-5 rounded-full border-2 border-gray-300 flex items-center justify-center flex-shrink-0">
                  <svg class="check-icon w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                </div>
              </div>
              <p class="text-xs text-gray-500 leading-relaxed line-clamp-2">${b.description}</p>
            </div>
            <div class="mt-3 pt-3 border-t border-gray-100 flex justify-between items-center">
              <span class="font-extrabold text-[#EF9099]">${b.price}</span>
              ${window._isAdminAuthenticated ? `<button onclick="deleteBeverage('${b.id}', event)" class="text-xs text-red-500 hover:underline">삭제</button>` : ''}
            </div>
          </div>
        `).join('');

        container.innerHTML += `
          <div class="mb-8">
            <h3 class="text-[#EF9099] font-bold text-lg mb-4 flex items-center">
              <span class="w-2 h-2 bg-[#EF9099] rounded-full mr-2 inline-block"></span>${cat}
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">${cardsHtml}</div>
          </div>
        `;
      });

      window._beverages.forEach(b => {
        const card = document.getElementById(`card-${b.id}`);
        if (card) {
          card.addEventListener('click', (e) => {
            if(e.target.tagName !== 'BUTTON') window.selectBeverage(b.id);
          });
        }
      });
    }

    // ====== 신규: 관리자 메뉴 추가 & 이미지 업로드 ======
    window.openMenuModal = function() {
      document.getElementById('menu-add-modal').classList.add('open');
    }
    window.closeMenuModal = function() {
      document.getElementById('menu-add-modal').classList.remove('open');
      document.getElementById('menu-form').reset();
    }

    window.handleAddMenu = async function(e) {
      e.preventDefault();
      const btn = document.getElementById('menu-submit-btn');
      btn.disabled = true;
      btn.textContent = '업로드 중...';

      try {
        const name = document.getElementById('menu-name').value;
        const category = document.getElementById('menu-category').value;
        const price = document.getElementById('menu-price').value;
        const desc = document.getElementById('menu-desc').value;
        const fileInput = document.getElementById('menu-image');
        
        let imageUrl = '';

        // 이미지가 선택된 경우 업로드 처리
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const fileExt = file.name.split('.').pop();
          const fileName = `${Date.now()}.${fileExt}`;
          const filePath = `public/${fileName}`;

          const { error: uploadError } = await supabase.storage
            .from('menu-images')
            .upload(filePath, file);

          if (uploadError) throw uploadError;

          // 업로드된 이미지의 공개 URL 가져오기
          const { data } = supabase.storage.from('menu-images').getPublicUrl(filePath);
          imageUrl = data.publicUrl;
        }

        // DB에 메뉴 정보 저장
        const { error: dbError } = await supabase.from('beverages').insert([{
          name: name,
          category: category,
          price: price,
          description: desc,
          image_url: imageUrl
        }]);

        if (dbError) throw dbError;

        showModal(`'${name}' 메뉴가 성공적으로 등록되었습니다!`);
        closeMenuModal();
        fetchBeverages(); // 바뀐 메뉴판 다시 그리기

      } catch (error) {
        console.error(error);
        showModal('메뉴 등록 중 오류가 발생했습니다.');
      } finally {
        btn.disabled = false;
        btn.textContent = '메뉴 등록하기';
      }
    }

    window.deleteBeverage = async function(id, event) {
      event.stopPropagation();
      if (!confirm('정말 이 메뉴를 삭제하시겠습니까?')) return;
      try {
        await supabase.from('beverages').delete().eq('id', id);
        showModal('메뉴가 삭제되었습니다.');
        fetchBeverages();
      } catch(e) {
        showModal('삭제 실패');
      }
    }

    // ====== 기존 로직들 (주문 제출, 통계 요약, CSV, 관리자 등) ======
    window.selectBeverage = function(id) {
      const bev = window._beverages.find(b => b.id === id);
      window._selectedBeverage = bev;
      document.querySelectorAll('.beverage-card').forEach(c => c.classList.remove('selected'));
      document.getElementById('card-' + id).classList.add('selected');
      document.getElementById('submit-btn').disabled = false;
    }

    window.submitOrder = async function() {
      const teacherName = document.getElementById('teacherName').value.trim();
      const selectedBeverage = window._selectedBeverage;
      const memo = document.getElementById('additionalMemo').value.trim();

      if (!teacherName) { showModal('성함을 정확하게 입력해 주세요.'); return; }
      if (!selectedBeverage) { showModal('메뉴를 선택해 주세요.'); return; }

      const isAlreadyOrdered = window._orders.some(o => o.teacher_name === teacherName);
      if (isAlreadyOrdered) {
        if (!confirm(`[${teacherName}] 선생님의 기존 주문 내역이 이미 존재합니다.\n새로운 주문으로 변경하시겠습니까?`)) return;
      }

      const btn = document.getElementById('submit-btn');
      const originalText = btn.innerHTML;
      btn.innerHTML = `전송 중...`;

      try {
        await supabase.from('orders').upsert([
          { teacher_name: teacherName, beverage_name: selectedBeverage.name, price: selectedBeverage.price, memo: memo || '', timestamp: Date.now() }
        ], { onConflict: 'teacher_name' });

        showModal(`[${teacherName}] 선생님,\n[${selectedBeverage.name}] 주문이 성공적으로 저장되었습니다!`);
        document.getElementById('teacherName').value = '';
        document.getElementById('additionalMemo').value = '';
        window._selectedBeverage = null;
        document.querySelectorAll('.beverage-card').forEach(c => c.classList.remove('selected'));
      } catch (e) {
        showModal('오류가 발생했습니다.');
      } finally {
        btn.innerHTML = originalText;
      }
    };

    window.deleteOrder = async function(orderId) {
      if (!confirm('정말 이 주문을 삭제하시겠습니까?')) return;
      await supabase.from('orders').delete().eq('id', orderId);
      fetchOrders();
    };

    function renderOrderSummary(orders) {
      const validMenuNames = window._beverages.map(b => b.name);
      const validOrders = orders.filter(o => validMenuNames.includes(o.beverage_name));

      document.getElementById('order-count').textContent = validOrders.length;
      let totalAmount = 0;
      const menuCounts = {};

      validOrders.forEach(o => {
        const priceNum = parseInt(o.price.replace(/[^0-9]/g, ''), 10) || 0;
        totalAmount += priceNum;
        menuCounts[o.beverage_name] = (menuCounts[o.beverage_name] || 0) + 1;
      });

      document.getElementById('total-amount').textContent = totalAmount.toLocaleString('ko-KR') + '원';
      const summaryContainer = document.getElementById('menu-summary-container');
      
      if (validOrders.length === 0) {
        summaryContainer.innerHTML = '<p class="text-gray-400 text-sm py-2">주문된 메뉴가 없습니다.</p>';
      } else {
        summaryContainer.innerHTML = Object.entries(menuCounts).map(([name, count]) => `
          <div class="bg-[#fdf2f3] border border-[#EF9099]/30 px-3 py-2 rounded-xl flex justify-between items-center text-sm shadow-sm">
            <span class="font-bold text-gray-800">${name}</span>
            <span class="font-extrabold text-[#EF9099] bg-white border border-[#EF9099]/30 px-2 py-0.5 rounded-md">${count}잔</span>
          </div>
        `).join('');
      }

      const tbody = document.getElementById('order-table-body');
      if (validOrders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-gray-400">접수된 주문이 없습니다.</td></tr>`;
      } else {
        tbody.innerHTML = validOrders.map((o, i) => `
          <tr class="border-b border-gray-100 hover:bg-gray-50">
            <td class="py-3 px-4">${i + 1}</td>
            <td class="py-3 px-4 font-bold">${o.teacher_name}</td>
            <td class="py-3 px-4 text-[#EF9099] font-medium">${o.beverage_name}</td>
            <td class="py-3 px-4 text-gray-600">${o.memo || '-'}</td>
            <td class="py-3 px-4 text-gray-400 text-sm">${new Date(o.timestamp).toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit'})}</td>
            ${window._isAdminAuthenticated ? `<td class="py-3 px-4 text-center"><button onclick="deleteOrder('${o.id}')" class="text-red-500 text-xs">삭제</button></td>` : '<td></td>'}
          </tr>
        `).join('');
      }
    }

    window.openAdminPage = function() {
      if (window._isAdminAuthenticated) {
        window._isAdminAuthenticated = false;
        document.getElementById('admin-btn-text').textContent = '관리자 로그인';
        document.getElementById('admin-menu-btn').style.display = 'none'; // 메뉴 관리 버튼 숨기기
        renderMenu(); // 삭제 버튼 숨기기 위함
        renderOrderSummary(window._orders);
        showModal('관리자 모드가 해제되었습니다.');
      } else {
        document.getElementById('admin-login-modal').classList.add('open');
      }
    }
    
    window.handleAdminLogin = function() {
      const pw = document.getElementById('admin-password').value;
      if (pw === '2026') { 
        window._isAdminAuthenticated = true;
        document.getElementById('admin-login-modal').classList.remove('open');
        document.getElementById('admin-btn-text').textContent = '관리자 로그아웃';
        document.getElementById('admin-menu-btn').style.display = 'flex'; // 메뉴 관리 버튼 보이기
        renderMenu(); // 메뉴 삭제 버튼 활성화 위함
        renderOrderSummary(window._orders);
        showModal('관리자 인증 완료! \n[새 메뉴 추가] 및 [주문 삭제]가 가능합니다.');
      } else {
        showModal('비밀번호가 일치하지 않습니다.');
      }
      document.getElementById('admin-password').value = '';
    }

    function showModal(msg) {
      document.getElementById('modal-message').textContent = msg;
      document.getElementById('modal-overlay').classList.add('open');
    }
    window.closeModal = function() { document.getElementById('modal-overlay').classList.remove('open'); }
    window.closeAdminLogin = function() { document.getElementById('admin-login-modal').classList.remove('open'); }
    
    document.addEventListener('DOMContentLoaded', initApp);
  </script>

  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
    .beverage-card { cursor: pointer; border: 2px solid #f3f4f6; transition: all 0.2s; }
    
    /* 🎨 선택 및 호버 색상을 #EF9099(딸기우유 핑크)로 완벽 교체 */
    .beverage-card:hover { border-color: #EF9099; } 
    .beverage-card.selected { border-color: #EF9099; background-color: #fdf2f3; box-shadow: 0 0 0 1px #EF9099; } 
    .beverage-card.selected .check-circle { background-color: #EF9099; border-color: #EF9099; }
    
    .beverage-card.selected .check-icon { display: block; }
    .check-icon { display: none; }
    #modal-overlay, #admin-login-modal, #menu-add-modal { display: none; }
    #modal-overlay.open, #admin-login-modal.open, #menu-add-modal.open { display: flex; }
  </style>
</head>

<body class="bg-gray-50">

<!-- 공통 메시지 모달 -->
<div id="modal-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm items-center justify-center z-[100] p-4">
  <div class="bg-white rounded-2xl p-8 max-w-sm w-full text-center border-t-4 border-[#EF9099]">
    <h3 id="modal-message" class="text-xl font-bold text-gray-900 mb-6 whitespace-pre-wrap"></h3>
    <button onclick="closeModal()" class="w-full bg-[#EF9099] text-white py-3 rounded-lg font-bold hover:bg-[#d67e86]">확인</button>
  </div>
</div>

<!-- 관리자 로그인 모달 -->
<div id="admin-login-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl p-8 max-w-sm w-full">
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-xl font-bold text-[#EF9099]">관리자 인증</h3>
      <button onclick="closeAdminLogin()" class="text-gray-400 hover:text-gray-600">X</button>
    </div>
    <input type="password" id="admin-password" placeholder="비밀번호(2026)" class="w-full border rounded-lg py-3 px-4 mb-4 focus:outline-none focus:border-[#EF9099] focus:ring-1 focus:ring-[#EF9099]" onkeydown="if(event.key==='Enter') handleAdminLogin()" />
    <button onclick="handleAdminLogin()" class="w-full bg-[#EF9099] text-white py-3 rounded-lg font-bold hover:bg-[#d67e86]">인증하기</button>
  </div>
</div>

<!-- 신규: 관리자 전용 메뉴 추가 모달 -->
<div id="menu-add-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm items-center justify-center z-[70] p-4">
  <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl">
    <div class="flex justify-between items-center mb-4 border-b pb-2">
      <h3 class="text-xl font-bold text-[#EF9099]">✨ 새 메뉴 추가하기</h3>
      <button onclick="closeMenuModal()" class="text-gray-400 font-bold hover:text-[#EF9099]">X</button>
    </div>
    <form id="menu-form" onsubmit="handleAddMenu(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">카테고리</label>
        <input type="text" id="menu-category" placeholder="예: 생과일주스, 커피, 디저트" required class="w-full border rounded-lg p-2 bg-gray-50 focus:outline-none focus:border-[#EF9099] focus:ring-1 focus:ring-[#EF9099]">
      </div>
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">메뉴 이름</label>
        <input type="text" id="menu-name" placeholder="예: 딸기바나나쥬스" required class="w-full border rounded-lg p-2 bg-gray-50 focus:outline-none focus:border-[#EF9099] focus:ring-1 focus:ring-[#EF9099]">
      </div>
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">가격</label>
        <input type="text" id="menu-price" placeholder="예: 6,000원" required class="w-full border rounded-lg p-2 bg-gray-50 focus:outline-none focus:border-[#EF9099] focus:ring-1 focus:ring-[#EF9099]">
      </div>
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">메뉴 설명</label>
        <input type="text" id="menu-desc" placeholder="예: 상큼달콤 유달리 베스트 메뉴!" class="w-full border rounded-lg p-2 bg-gray-50 focus:outline-none focus:border-[#EF9099] focus:ring-1 focus:ring-[#EF9099]">
      </div>
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">음료 사진 (선택사항)</label>
        <input type="file" id="menu-image" accept="image/*" class="w-full border rounded-lg p-2 bg-gray-50 text-sm focus:outline-none focus:border-[#EF9099] focus:ring-1 focus:ring-[#EF9099]">
      </div>
      <button type="submit" id="menu-submit-btn" class="w-full bg-[#EF9099] text-white py-3 rounded-lg font-bold hover:bg-[#d67e86] mt-2 transition-colors">메뉴 등록하기</button>
    </form>
  </div>
</div>

<div class="flex flex-col md:flex-row min-h-screen">
  <!-- 사이드바 (딸기우유 핑크 컬러로 변경!) -->
  <aside class="w-full md:w-1/3 lg:w-1/4 bg-[#EF9099] text-white p-8 flex flex-col justify-between shadow-xl">
    <div>
      <h1 class="text-sm font-bold tracking-widest mb-4 opacity-90 text-yellow-200">TEACHER WORKSHOP ORDER KIT</h1>
      <div class="text-5xl md:text-6xl font-extrabold text-white mb-4 tracking-tight leading-tight select-none">
        유달리<br />
        <span class="text-yellow-300 text-3xl md:text-4xl tracking-normal border-b-4 border-yellow-300/50 pb-1 mt-1 inline-block">U DALLY</span>
      </div>
      <p class="text-base text-white/95 mt-10 font-medium leading-relaxed italic antialiased select-none">
        신선한 과일과 함께하는,<br />
        선생님들을 위한 산뜻한 한 잔 🍓
      </p>
    </div>
    <div class="mt-12 md:mt-0">
      <div class="bg-[#d67e86] rounded-xl p-4 flex items-center justify-between shadow-inner">
        <div>
          <div class="font-bold text-white">데이터베이스 상태</div>
          <div id="status-text" class="text-xs text-white/80 mt-1">연결 중...</div>
        </div>
        <div id="status-dot" class="w-3 h-3 rounded-full bg-gray-300"></div>
      </div>
    </div>
  </aside>

  <main class="flex-1 p-8 lg:p-12 overflow-y-auto">
    <div class="max-w-4xl mx-auto">
      
      <!-- 상단 버튼들 -->
      <div class="flex justify-end mb-4 gap-2">
        <button id="admin-menu-btn" onclick="openMenuModal()" style="display: none;"
          class="flex items-center space-x-2 border border-[#EF9099] bg-[#fdf2f3] rounded-full px-4 py-1.5 text-xs font-bold text-[#EF9099] hover:bg-[#EF9099] hover:text-white transition-colors shadow-sm">
          <span>+ 메뉴 추가하기</span>
        </button>
        <button onclick="openAdminPage()"
          class="flex items-center space-x-2 border border-gray-300 rounded-full px-4 py-1.5 text-xs font-semibold text-gray-600 hover:bg-gray-100 hover:border-[#EF9099] hover:text-[#EF9099] transition-colors shadow-sm">
          <span id="admin-btn-text">관리자 로그인</span>
        </button>
      </div>

      <div class="flex flex-col md:flex-row md:items-end justify-between mb-8 gap-4">
        <div>
          <h1 class="text-4xl font-extrabold text-gray-900 mb-2">MENU</h1>
          <p class="text-gray-600">선생님들께서는 성함과 원하시는 메뉴를 선택해 주세요.</p>
        </div>
        <!-- 네이버 유달리 메뉴 링크 -->
        <a href="https://m.place.naver.com/restaurant/42207711/menu/list" target="_blank" rel="noopener noreferrer"
          class="flex items-center space-x-2 text-sm font-bold text-[#EF9099] bg-white border border-[#EF9099] px-4 py-2 rounded-full hover:bg-[#EF9099] hover:text-white transition-colors shrink-0">
          <span>유달리 메뉴판 보기</span>
        </a>
      </div>

      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-10 flex flex-col gap-6">
        <div>
          <label class="block text-sm font-bold text-[#EF9099] mb-2">👤 선생님 성함 <span class="text-red-500">*</span></label>
          <input type="text" id="teacherName" placeholder="예: 홍길동" autocomplete="off"
            class="w-full border border-gray-300 rounded-lg py-3 px-4 focus:border-[#EF9099] focus:ring-1 focus:ring-[#EF9099] focus:outline-none bg-gray-50 transition-colors" />
        </div>
        <div>
          <label class="block text-sm font-bold text-[#EF9099] mb-2">💬 비고 (HOT / ICE / 시럽추가 등)</label>
          <input type="text" id="additionalMemo" placeholder="선택사항을 입력해주세요" autocomplete="off"
            class="w-full border border-gray-300 rounded-lg py-3 px-4 focus:border-[#EF9099] focus:ring-1 focus:ring-[#EF9099] focus:outline-none bg-gray-50 transition-colors text-sm" />
        </div>
      </div>

      <!-- 동적 메뉴가 그려지는 곳 -->
      <div id="menu-container" class="mb-12"></div>

      <button id="submit-btn" onclick="submitOrder()" disabled
        class="w-full text-white text-lg font-bold py-5 rounded-xl transition-all shadow-lg bg-gray-400 cursor-not-allowed mb-12">
        선택 완료 및 주문 제출하기
      </button>

      <!-- 현황판 부분 (동일) -->
      <div class="bg-white rounded-2xl border border-gray-200 shadow-sm flex flex-col overflow-hidden mb-12">
        <div class="bg-gray-800 p-5 text-white flex justify-between items-center">
          <div>
            <h2 class="text-xl font-bold">📊 실시간 주문 현황판</h2>
          </div>
        </div>
        <div class="p-5 bg-gray-50 border-b border-gray-200 flex gap-4">
          <div class="bg-white p-4 rounded-xl border flex-1">
            <div class="text-xs text-gray-500 font-bold mb-1">총 주문 수량</div>
            <div class="text-2xl font-extrabold text-[#EF9099]"><span id="order-count">0</span><span class="text-sm text-gray-600 font-medium ml-1">잔</span></div>
          </div>
          <div class="bg-white p-4 rounded-xl border flex-1">
            <div class="text-xs text-gray-500 font-bold mb-1">예상 결제 금액</div>
            <div class="text-2xl font-extrabold text-[#EF9099]"><span id="total-amount">0원</span></div>
          </div>
        </div>
        <div class="p-5 border-b border-gray-100">
          <h3 class="text-xs font-bold text-gray-500 mb-3">📋 메뉴별 집계 현황</h3>
          <div id="menu-summary-container" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></div>
        </div>
        <div class="p-5 overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b-2 border-gray-200 text-sm">
                <th class="py-2.5 px-4 font-bold text-gray-600 bg-gray-50 w-16">순번</th>
                <th class="py-2.5 px-4 font-bold text-gray-600 bg-gray-50 w-28">성함</th>
                <th class="py-2.5 px-4 font-bold text-gray-600 bg-gray-50">주문 메뉴</th>
                <th class="py-2.5 px-4 font-bold text-gray-600 bg-gray-50">비고</th>
                <th class="py-2.5 px-4 font-bold text-gray-600 bg-gray-50 w-24">시간</th>
                <th class="py-2.5 px-4 font-bold text-gray-600 bg-gray-50 w-16 text-center">관리</th>
              </tr>
            </thead>
            <tbody id="order-table-body" class="text-sm"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
